:root{--osso:#EEE7DB;--osso2:#F6F1E8;--osso3:#E5DCCC;--ink:#17140F;--txt:#3D382F;--mut:#6A6358;--bronze:#A88655;--bronze2:#7A5F38;--oxido:#9E3B24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--osso);color:var(--ink);font-family:Manrope,Arial,sans-serif;font-size:16px;line-height:1.55}
.w{max-width:580px;margin:0 auto;padding:22px 20px 120px}
.top{border-bottom:1px solid var(--bronze);padding:6px 0 16px;margin-bottom:26px}
.top img{width:190px;max-width:60%;display:block}
.lab{font-family:Manrope,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze2)}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:40px;line-height:1.06;margin:10px 0 18px;letter-spacing:-.01em}
h1 em,h2 em{font-style:normal;color:var(--oxido)}
h2{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:27px;line-height:1.15;margin:6px 0 12px}
h3{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:21px;line-height:1.2;margin:0 0 10px}
p{color:var(--txt);margin-bottom:12px}
.lead{font-size:17px}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 22px;padding:14px 0;border-top:1px solid rgba(168,134,85,.5);border-bottom:1px solid rgba(168,134,85,.5)}
.meta div{font-size:14px;color:var(--txt)}.meta b{display:block;font-family:Fraunces,serif;font-weight:400;font-size:24px;color:var(--ink)}
.fld{margin:8px 0 18px}.fld label{display:block;font-weight:600;margin-bottom:8px}
.fld input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--osso2);border:1px solid rgba(168,134,85,.75);padding:13px 14px;border-radius:0;outline:none;-webkit-appearance:none}
.fld input:focus{border-color:var(--oxido)}
.note{border-left:2px solid var(--bronze);padding:4px 0 4px 14px;font-size:13.5px;line-height:1.5;color:var(--mut);margin:18px 0}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-family:Manrope,sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--osso);background:var(--ink);border:0;border-radius:0;padding:18px 14px;cursor:pointer}
.btn:active{background:var(--oxido)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.br{background:var(--bronze2)}
.prog{position:sticky;top:0;z-index:3;background:var(--osso);padding:12px 0 10px;margin:-6px 0 14px}
.prog .t{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:7px}
.prog .b{height:3px;background:var(--osso3)}.prog .b i{display:block;height:3px;background:var(--oxido);width:0;transition:width .3s}
.scl{font-size:13px;color:var(--mut);background:var(--osso2);border:1px solid rgba(168,134,85,.4);padding:10px 12px;margin:4px 0 8px}
.it{padding:22px 0;border-bottom:1px solid rgba(168,134,85,.35);scroll-margin-top:70px}
.it .qt{font-size:16.5px;color:var(--ink);font-weight:500;line-height:1.45;margin-bottom:14px}
.it .qn{font-size:12px;color:var(--bronze2);font-weight:600;margin-right:8px}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk button{font:inherit;font-weight:600;font-size:17px;color:var(--ink);background:var(--osso2);border:1px solid rgba(168,134,85,.6);border-radius:0;min-height:52px;cursor:pointer}
.lk button.on{background:var(--ink);border-color:var(--ink);color:var(--osso)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px}
.sel{font-size:13px;color:var(--oxido);min-height:18px;margin-top:4px;text-align:center}
.it.miss .lk button{border-color:var(--oxido)}.it.miss .sel{color:var(--oxido)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--osso);border-top:1px solid var(--bronze);padding:10px 20px calc(10px + env(safe-area-inset-bottom));z-index:4}
.nav .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.nav .btn{padding:16px 10px}
.hide{display:none!important}
.hero{background:var(--ink);color:var(--osso);padding:26px 22px;margin:6px 0 22px}
.hero .lab{color:var(--bronze)}
.hero h1{color:var(--osso);font-size:33px;margin:10px 0 12px}
.hero p{color:#D9D0C1;margin:0}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:18px 0 6px}
.lvl span{font-size:11px;text-align:center;padding:8px 2px;border:1px solid rgba(168,134,85,.6);color:#B9AE9C;letter-spacing:.04em}
.lvl span.on{background:var(--oxido);border-color:var(--oxido);color:var(--osso);font-weight:600}
.blk{padding:24px 0;border-top:1px solid rgba(168,134,85,.5)}
.bars .r{margin:12px 0}
.bars .r .h{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.bars .r .h b{font-weight:600}.bars .r .h span{color:var(--mut);font-size:13px;white-space:nowrap}
.bar{height:8px;background:var(--osso3);margin-top:6px}.bar i{display:block;height:8px;background:var(--bronze)}
.bars .r.top .bar i{background:var(--oxido)}
.quote{list-style:none;margin:6px 0 14px}.quote li{position:relative;padding:8px 0 8px 18px;color:var(--txt);font-size:15px;border-bottom:1px dashed rgba(168,134,85,.35)}
.quote li:before{content:"";position:absolute;left:0;top:17px;width:7px;height:7px;background:var(--bronze)}
.or{background:var(--osso2);border-left:3px solid var(--oxido);padding:16px 18px;margin:12px 0}
.or p:last-child{margin-bottom:0}
.or .lab{margin-bottom:6px;display:block}
.step{font-weight:600;color:var(--ink)}
.cta{border:1px solid var(--bronze);padding:20px;margin:26px 0 18px;text-align:left}
.cta p{font-size:15px}
.cta a{color:var(--oxido);font-weight:600;text-decoration:none;border-bottom:1px solid var(--oxido);padding-bottom:2px;display:inline-block;margin-top:2px}
.acts{display:grid;gap:10px;margin-top:10px}
#ov{position:fixed;inset:0;background:rgba(23,20,15,.94);z-index:9;overflow:auto;padding:18px}
#ov .c{max-width:580px;margin:0 auto;background:var(--osso);padding:18px}
#ov img{width:100%;display:block;margin:10px 0;border:1px solid var(--bronze)}
#ov textarea{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid var(--bronze);background:var(--osso2);margin:10px 0}
.foot{margin-top:28px;font-size:12px;color:var(--mut)}
@media(max-width:360px){h1{font-size:34px}.lk button{min-height:48px;font-size:16px}}
@media print{.nav,#ov,.acts,.prog,.cta a.pr-hide{display:none!important}body{background:#fff}.w{padding:0}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.bar,.bar i,.lvl span.on,.or{-webkit-print-color-adjust:exact;print-color-adjust:exact}.blk{break-inside:avoid}}

{id:"rej",n:"Rejeição",nm:"medo de rejeição",
d:"O medo de rejeição é o medo de não ser escolhido(a). Ele faz você ler sinais pequenos como um veredito sobre o seu valor: a mensagem que demora, a cara séria, o convite que não veio. Por trás dele costuma existir uma conta antiga, a de que para ser aceito(a) é preciso agradar.",
gL:["Esse medo aparece em você, mas ainda não comanda as suas escolhas. O trabalho aqui é perceber o momento em que ele começa, que costuma ser quando você já está ensaiando a resposta do outro antes mesmo de falar.","Nessas horas, eu sugiro uma pergunta simples: o que eu faria se a resposta dessa pessoa não definisse o meu valor?"],
sL:"Faça um pedido pequeno que você vinha adiando e observe o que acontece com o “não”, se ele vier. Quase sempre ele dói menos do que a espera por ele.",
gA:["Quando esse medo está alto, a vida vai se organizando em torno de não ser recusado(a). Você se adapta, se antecipa, cede, e com o tempo fica difícil saber o que você quer de verdade.","Antes de tentar ter mais autoestima, eu começaria separando dois fatos que o medo junta: ser recusado(a) numa situação e não ter valor. Enquanto os dois parecem a mesma coisa, qualquer “não” vira ameaça."],
sA:"Escolha uma situação de baixo risco e diga o que você prefere, sem justificar. Sinta o desconforto de esperar a reação do outro e não corra para consertar. Esse desconforto tolerado à vista ensina ao seu corpo que ele sobrevive a uma recusa."},
{id:"fra",n:"Fracasso",nm:"medo de fracassar",
d:"O medo de fracassar é o medo de que um erro prove algo ruim sobre você. Ele aparece como perfeccionismo, como adiamento ou como uma cobrança que nunca descansa. E o peso de um erro costuma vir do significado que você dá a ele.",
gL:["Você sente esse medo em algumas áreas, mas ainda consegue agir apesar dele. Observe onde ele aparece mais. Costuma ser justamente onde algo importa muito para você.","Quando a cobrança subir, eu sugiro trocar a pergunta “e se eu errar?” por “o que eu faço se eu errar?”. A primeira paralisa, a segunda prepara."],
sL:"Entregue alguma coisa no ponto do “bom o suficiente” e repare no que acontece. Em geral, as pessoas notam muito menos o detalhe que você corrigiria do que você imagina.",
gA:["Com esse medo alto, o resultado vira a medida do seu valor. Por isso adiar alivia: enquanto você não tenta, ninguém pode avaliar. O custo é que a vida vai ficando menor do que a sua capacidade.","O caminho que eu proponho tem dois lados. De um lado, separar desempenho de valor pessoal: você pode fazer algo mal feito e continuar sendo alguém de valor. Do outro, diminuir o primeiro passo até ele ficar pequeno demais para o medo ter onde se agarrar."],
sA:"Escolha uma tarefa que você está adiando e faça só os primeiros 15 minutos, aceitando que ela vai ficar imperfeita. Depois anote como se sentiu antes e depois de começar."},
{id:"exp",n:"Exposição e julgamento",nm:"medo de exposição e julgamento",
d:"O medo de exposição é o medo de ser visto(a) e avaliado(a). Ele faz você ensaiar antes de falar, esconder o que produz e calcular o que os outros vão pensar. Muitas vezes, quem sente esse medo tem muito a mostrar e guarda por receio de ser medido(a).",
gL:["Esse medo aparece em momentos específicos, como apresentar algo, postar ou falar em grupo. Ele costuma diminuir com repetição, porque o corpo vai aprendendo que ser visto(a) não traz o desastre que ele espera.","Repare que, quando você ensaia demais, a fala perde a sua voz. Um pouco de improviso costuma soar mais verdadeiro do que a frase perfeita."],
sL:"Fale uma vez numa situação em que normalmente ficaria calado(a), sem ensaiar muito. Perceba que a frase não precisa sair perfeita para ser ouvida.",
gA:["Quando esse medo está alto, você vive como se estivesse sempre num palco com júri. A tentativa comum é parecer segura: preparar tudo, controlar a voz, fingir confiança. Só que a encenação cansa e ainda confirma para o seu corpo que mostrar quem você é seria perigoso.","Eu proponho o caminho contrário: deixar um pouco do desconforto ficar à vista. Dizer “estou um pouco nervoso(a)” antes de falar costuma reduzir a tensão, porque você para de gastar energia escondendo."],
sA:"Mostre algo seu ainda incompleto para uma pessoa de confiança e peça uma opinião específica. O objetivo é treinar ser visto(a) antes de estar pronto(a)."},
{id:"aba",n:"Abandono",nm:"medo de abandono",
d:"O medo de abandono é o medo de que as pessoas importantes vão embora. Ele deixa você atento(a) a qualquer sinal de distância e pode levar você a aceitar menos do que precisa para manter a relação. Costuma ter raiz em experiências antigas de ausência, nem sempre lembradas como tal.",
gL:["Você sente esse medo em momentos de distância, mas ele não define as suas relações. Repare no que você faz quando ele aparece: se procura a pessoa para se acalmar, se se afasta antes ou se consegue esperar.","Esperar é o recurso que mais protege as suas relações, porque dá tempo para a realidade corrigir o que a angústia imaginou."],
sL:"Quando sentir o aperto, espere uma hora antes de agir sobre ele e anote o que imaginou. Depois compare com o que aconteceu de fato.",
gA:["Com esse medo alto, a relação vira lugar de vigilância. Você lê sinais, testa, se adapta e às vezes aceita o que não deveria para não perder.","Eu olharia primeiro para uma pergunta: quanto da sua estabilidade está apoiada em uma única pessoa? Quando tudo depende de alguém ficar, qualquer distância vira ameaça. O trabalho passa por construir outros apoios, como amizades, rotina e um projeto seu, e por aprender a ficar com a angústia da distância sem correr para resolvê-la."],

{id:"ctl",n:"Perda de controle",nm:"medo de perder o controle",
d:"O medo de perder o controle é o medo do imprevisto. Ele faz você planejar, conferir, antecipar e ter dificuldade de delegar. Visto de fora, parece organização. Visto de dentro, costuma ser um jeito de não sentir a insegurança de não saber o que vem.",
gL:["Você gosta de previsibilidade, e isso te ajuda em muitas áreas. O ponto de atenção é quando planejar deixa de ser ferramenta e vira condição para ficar em paz.","Um bom sinal para observar é o seu corpo quando algo sai do plano. Se a irritação passa rápido, o controle está a seu serviço. Se dura horas, ele está no comando."],
sL:"Deixe uma decisão pequena nas mãos de outra pessoa e não corrija depois.",
gA:["Quando esse medo está alto, a sua cabeça trabalha como um radar que nunca desliga. Tudo precisa estar previsto, e o que foge do plano gera irritação ou angústia. O custo é cansaço e, muitas vezes, relações tensas, porque as pessoas sentem que não podem errar perto de você.","Eu proponho treinar a tolerância à incerteza em doses pequenas, sem tentar resolver a ansiedade com mais controle. Cada vez que você controla para se acalmar, o alívio dura pouco e a necessidade de controlar cresce."],
sA:"Numa situação que te preocupa, separe numa folha o que depende de você e o que não depende. Aja só na primeira lista e, quando a cabeça voltar para a segunda, diga para si: isso não está comigo."},
{id:"con",n:"Conflito",nm:"medo de conflito",
d:"O medo de conflito é o medo de que discordar destrua a relação ou gere uma reação que você não consiga sustentar. Ele faz você engolir, ceder e acalmar o clima, mesmo quando sai perdendo. Quem sente esse medo costuma ser visto(a) como alguém tranquilo(a), enquanto por dentro vai acumulando o que não disse.",
gL:["Você evita alguns conflitos, mas consegue se posicionar quando o assunto é importante. Observe os temas que você sempre adia, porque eles costumam mostrar onde está o desconforto maior.","Discordar com calma costuma aproximar as pessoas, porque elas passam a saber onde você está."],
sL:"Discorde de algo pequeno, com calma, e não peça desculpas por isso.",
gA:["Com esse medo alto, você paga a paz do ambiente com a sua própria paz. O que não é dito vira ressentimento, cansaço ou explosões que depois geram culpa.","Eu proponho mudar o objetivo. Em vez de evitar o conflito, aprender a atravessá-lo de forma segura, com uma frase curta, sobre você, sem acusação: “eu não fiquei bem com isso”."],
sA:"Escolha uma conversa pendente de baixo risco e diga uma frase como essa. Depois, aguente o silêncio que vier sem correr para suavizar."},
{id:"suc",n:"Sucesso e destaque",nm:"medo de sucesso e destaque",
d:"O medo de sucesso é mais comum do que parece. É o receio do que vem junto com o destaque: cobrança, inveja, solidão, a sensação de não merecer ou de se afastar de quem você ama. Ele costuma aparecer como freio justamente quando as coisas começam a dar certo.",
gL:["Você sente algum desconforto com elogios e destaque, mas ainda se permite crescer. Observe o que você faz logo depois de uma conquista: se comemora, se diminui o que fez ou se já pensa no próximo problema.","Receber bem um reconhecimento também se aprende, e começa por não devolver o elogio com uma desculpa."],

const val=id=>S.a[id]===undefined?0:S.a[id];

const idsOf=d=>ALLQ.filter(q=>q[1]===d).map(q=>q[0]);
function compute(){const r={f:{},cnt:{}};
 F.forEach((f,ix)=>{const ids=idsOf(f.id);r.f[f.id]=pct(ids);r.cnt[f.id]=ids.filter(i=>val(i)==4).length*10+ids.filter(i=>val(i)==3).length});
 r.rank=F.map((f,ix)=>({id:f.id,v:r.f[f.id],c:r.cnt[f.id],ix})).sort((a,b)=>b.v-a.v||b.c-a.c||a.ix-b.ix);
 r.p=r.rank[0].id;r.s=r.rank[1].id;r.pv=r.rank[0].v;r.sv=r.rank[1].v;
 r.imp={};["i_trab","i_rel","i_img"].forEach(k=>r.imp[k]=pct([ALLQ.find(q=>q[1]===k)[0]]));
 r.impM=pct(ALLQ.filter(q=>q[1].startsWith("i_")).map(q=>q[0]));
 r.idx=Math.round((2*r.pv+r.impM)/3);r.lv=lvOf(r.idx);r.high=r.idx>=55;r.none=r.pv<25;
 const sids=ALLQ.filter(q=>q[1].startsWith("s_"));r.stM=pct(sids.map(q=>q[0]));
 r.st=sids.map((q,ix)=>({id:q[1],v:val(q[0]),ix})).sort((a,b)=>b.v-a.v||a.ix-b.ix);
 r.ori=pct(idsOf("ori"));
 r.quotes=ALLQ.filter(q=>q[1]===r.p&&val(q[0])>=3).sort((a,b)=>val(b[0])-val(a[0])).slice(0,3).map(q=>q[2]);
 return r}

 if(r.pv===0)B.push({t:"Para continuar se observando",p:["Quando as respostas saem todas baixas, eu sugiro uma checagem simples: pense na última vez em que você deixou de fazer algo que queria. O que você imaginou que aconteceria? A resposta costuma apontar para o medo que ficou de fora do radar."]});
 else B.push({t:"Orientações para o seu "+P.nm,p:g.concat(["<span class=\"step\">Para esta semana:</span> "+st])});
 if(r.lv.k==="muitoalto")B.push({t:"Sobre o nível muito alto",p:["Com o medo nesse nível, eu não esperaria ele passar sozinho. Quando o medo pesa em várias áreas ao mesmo tempo, ter alguém acompanhando o processo encurta muito o caminho e evita que você se cobre por não conseguir."]});
 /* aprovação e evitação */
 const m=r.st[0];
 if(r.stM>=50){const tops=r.st.filter(x=>x.v>=3).slice(0,3).map(x=>ST[x.id].n.toLowerCase());
  B.push({t:"Os sinais de busca por aprovação",p:["Esses sinais apareceram com força nas suas respostas"+(tops.length?", principalmente "+lista(tops):"")+". Eles funcionam como pequenos pedidos de permissão. Cada um alivia na hora e, somados, comunicam ao outro e a você mesmo(a) que a sua posição depende do aval de alguém.",
  "Eu não pediria para você parar todos de uma vez. Escolha um, o que mais aparece, e observe por uma semana sem se cobrar. Só perceber já começa a mudar o hábito.",

 else if(r.high)B.push({t:"Um medo que age em silêncio",p:["Os sinais visíveis de busca por aprovação saíram baixos, mesmo com o medo alto. Isso pode indicar que ele age mais por dentro, em pensamentos e decisões silenciosas, do que no comportamento. Vale observar o que você deixa de fazer, mais do que o que você faz."]});
 /* origem familiar */
 if(r.ori>=50){const p=["Suas respostas indicam que esse medo pode ter raiz na história da sua família. Muitas vezes o medo foi aprendido como proteção: alguém viveu algo difícil e passou o cuidado adiante. Ele fazia sentido lá e pode não fazer mais na sua vida de hoje.","A pergunta que eu deixo é: de quem é esse medo? Se ele pertence a alguém que veio antes de você, dá para honrar essa pessoa sem carregar o mesmo peso."];
  if(["fra","suc","exp"].includes(r.p))p.push("No seu caso, como o medo predominante tem a ver com crescer e aparecer, observe a lealdade familiar. Às vezes crescer é sentido como trair o vínculo, como se ir mais longe que os seus fosse deixar de pertencer. Ir mais longe pode ser também uma forma de abrir caminho para eles.");
  else if(["rej","aba"].includes(r.p))p.push("No seu caso, como o medo predominante tem a ver com vínculo, olhe para como o afeto circulava em casa: se era preciso merecer, se havia ausências, se alguém ia embora. A criança aprende a se adaptar para manter o vínculo, e o adulto continua fazendo isso sem perceber.");
  else p.push("No seu caso, como o medo predominante tem a ver com controle ou conflito, olhe para o clima da casa: brigas, imprevisibilidade, alguém de quem era preciso adivinhar o humor. Controlar e evitar atrito foram formas inteligentes de se proteger naquela época, e hoje podem estar custando caro.");
  B.push({t:"De quem é esse medo?",p:p})}
 else if(r.ori>=30)B.push({t:"Sobre a origem",p:["A origem familiar apareceu de forma moderada. Vale observar se alguém na sua família reagia ao mundo com cuidados parecidos com os seus. Reconhecer de onde um medo veio ajuda a decidir o que você quer manter dele."]});
 return B}
function lista(a){return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" e "+a[a.length-1]}

function wrap(x,text,X,y,w,lh){const words=plain(text).split(" ");let line="";for(const wd of words){const t=line?line+" "+wd:wd;if(x.measureText(t).width>w&&line){x.fillText(line,X,y);y+=lh;line=wd}else line=t}if(line){x.fillText(line,X,y);y+=lh}return y}
