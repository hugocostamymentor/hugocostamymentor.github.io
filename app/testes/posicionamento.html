:root{--osso:#EEE7DB;--osso2:#F6F1E8;--osso3:#E5DCCC;--ink:#17140F;--txt:#3D382F;--mut:#6A6358;--bronze:#A88655;--bronze2:#7A5F38;--oxido:#9E3B24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--osso);color:var(--ink);font-family:Manrope,Arial,sans-serif;font-size:16px;line-height:1.55}
.w{max-width:580px;margin:0 auto;padding:22px 20px 120px}
.top{border-bottom:1px solid var(--bronze);padding:6px 0 16px;margin-bottom:26px}
.top img{width:190px;max-width:60%;display:block}
.lab{font-family:Manrope,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze2)}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:40px;line-height:1.06;margin:10px 0 18px;letter-spacing:-.01em}
h1 em,h2 em{font-style:normal;color:var(--oxido)}
h2{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:27px;line-height:1.15;margin:6px 0 12px}
h3{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:21px;line-height:1.2;margin:0 0 10px}
p{color:var(--txt);margin-bottom:12px}
.lead{font-size:17px}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 22px;padding:14px 0;border-top:1px solid rgba(168,134,85,.5);border-bottom:1px solid rgba(168,134,85,.5)}
.meta div{font-size:14px;color:var(--txt)}.meta b{display:block;font-family:Fraunces,serif;font-weight:400;font-size:24px;color:var(--ink)}
.fld{margin:8px 0 18px}.fld label,.fld .fl{display:block;font-weight:600;margin-bottom:8px}
.fld input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--osso2);border:1px solid rgba(168,134,85,.75);padding:13px 14px;border-radius:0;outline:none;-webkit-appearance:none}
.fld input:focus{border-color:var(--oxido)}
.sit{display:grid;gap:8px}
.sit button{font:inherit;font-size:15.5px;text-align:left;color:var(--ink);background:var(--osso2);border:1px solid rgba(168,134,85,.6);padding:14px 14px 14px 44px;position:relative;cursor:pointer;border-radius:0}
.sit button:before{content:"";position:absolute;left:15px;top:50%;width:16px;height:16px;margin-top:-8px;border:1px solid var(--bronze2);border-radius:50%}
.sit button.on{background:var(--ink);color:var(--osso);border-color:var(--ink)}
.sit button.on:before{background:var(--oxido);border-color:var(--osso);box-shadow:inset 0 0 0 3px var(--ink)}
.sit.miss button{border-color:var(--oxido)}
.err{color:var(--oxido);font-size:13.5px;min-height:18px;margin-top:6px}
.note{border-left:2px solid var(--bronze);padding:4px 0 4px 14px;font-size:13.5px;line-height:1.5;color:var(--mut);margin:18px 0}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-family:Manrope,sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--osso);background:var(--ink);border:0;border-radius:0;padding:18px 14px;cursor:pointer}
.btn:active{background:var(--oxido)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.br{background:var(--bronze2)}
.btn.ox{background:var(--oxido)}
.prog{position:sticky;top:0;z-index:3;background:var(--osso);padding:12px 0 10px;margin:-6px 0 14px}
.prog .t{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:7px}
.prog .b{height:3px;background:var(--osso3)}.prog .b i{display:block;height:3px;background:var(--oxido);width:0;transition:width .3s}
.scl{font-size:13px;color:var(--mut);background:var(--osso2);border:1px solid rgba(168,134,85,.4);padding:10px 12px;margin:4px 0 8px}
.it{padding:22px 0;border-bottom:1px solid rgba(168,134,85,.35);scroll-margin-top:70px}
.it .qt{font-size:16.5px;color:var(--ink);font-weight:500;line-height:1.45;margin-bottom:14px}
.it .qn{font-size:12px;color:var(--bronze2);font-weight:600;margin-right:8px}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk button{font:inherit;font-weight:600;font-size:17px;color:var(--ink);background:var(--osso2);border:1px solid rgba(168,134,85,.6);border-radius:0;min-height:52px;cursor:pointer}
.lk button.on{background:var(--ink);border-color:var(--ink);color:var(--osso)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px}
.sel{font-size:13px;color:var(--oxido);min-height:18px;margin-top:4px;text-align:center}
.it.miss .lk button{border-color:var(--oxido)}.it.miss .sel{color:var(--oxido)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--osso);border-top:1px solid var(--bronze);padding:10px 20px calc(10px + env(safe-area-inset-bottom));z-index:4}
.nav .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.nav .btn{padding:16px 10px}
.hide{display:none!important}
.hero{background:var(--ink);color:var(--osso);padding:26px 22px;margin:6px 0 22px}
.hero .lab{color:var(--bronze)}
.hero h1{color:var(--osso);font-size:31px;margin:10px 0 12px}
.hero p{color:#D9D0C1;margin:0}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:18px 0 6px}
.lvl span{font-size:10.5px;text-align:center;padding:8px 2px;border:1px solid rgba(168,134,85,.6);color:#B9AE9C;letter-spacing:.02em;line-height:1.25;display:flex;align-items:center;justify-content:center}
.lvl span.on{background:var(--oxido);border-color:var(--oxido);color:var(--osso);font-weight:600}
.blk{padding:24px 0;border-top:1px solid rgba(168,134,85,.5)}
.bars .r{margin:12px 0}
.bars .r .h{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.bars .r .h b{font-weight:600}.bars .r .h span{color:var(--mut);font-size:13px;white-space:nowrap}
.bar{height:8px;background:var(--osso3);margin-top:6px;position:relative}.bar i{display:block;height:8px;background:var(--bronze)}
.bar.tk:after{content:"";position:absolute;top:-3px;bottom:-3px;left:50%;border-left:1px dashed var(--mut)}
.bars .r.top .bar i{background:var(--oxido)}
.svgw{background:var(--osso2);border:1px solid rgba(168,134,85,.45);padding:10px;margin:12px 0}
.svgw svg{display:block;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
.dc{border:1px solid rgba(168,134,85,.55);background:var(--osso2);padding:18px;margin:14px 0}
.dc.top{border:0;border-left:4px solid var(--oxido);background:#fff}
.dc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dc .sc{font-family:Fraunces,serif;font-size:38px;line-height:1;color:var(--ink)}
.dc .sc small{font-family:Manrope,sans-serif;font-size:12px;color:var(--mut);display:block;text-align:right;margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.dc .bar{margin:10px 0 14px}
.dc.top .bar i{background:var(--oxido)}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--osso);background:var(--oxido);padding:4px 8px;margin-bottom:8px}
.quote{list-style:none;margin:6px 0 4px}.quote li{position:relative;padding:8px 0 8px 18px;color:var(--txt);font-size:14.5px;border-bottom:1px dashed rgba(168,134,85,.35)}
.quote li:before{content:"";position:absolute;left:0;top:17px;width:7px;height:7px;background:var(--bronze)}
.or{background:var(--osso2);border-left:3px solid var(--oxido);padding:16px 18px;margin:12px 0}
.or p:last-child{margin-bottom:0}
.or .lab{margin-bottom:6px;display:block}
.care{background:#F7E6E0;border:2px solid var(--oxido);padding:18px;margin:0 0 22px}
.care h3{color:var(--oxido)}
.care p{color:#3a1d14}
.care .btn{margin-top:6px}
.step{font-weight:600;color:var(--ink)}
.rules{list-style:none;margin:8px 0}
.rules li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:11px 0;border-bottom:1px dashed rgba(168,134,85,.4)}
.rules .ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--osso)}
.rules .ok{background:var(--bronze)}.rules .md{background:#C49A5A}.rules .no{background:var(--oxido)}
.rules b{display:block;font-weight:600;font-size:15px}.rules span{font-size:13.5px;color:var(--mut)}
.ladder{margin:10px 0}
.ladder .lv{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:9px 10px;border:1px solid rgba(168,134,85,.4);margin-bottom:-1px;background:var(--osso2)}
.ladder .lv b{font-family:Fraunces,serif;font-weight:400;font-size:22px;color:var(--bronze2);line-height:1.1}
.ladder .lv span{font-size:13.5px;color:var(--txt)}
.ladder .lv.on{background:var(--ink);border-color:var(--ink);position:relative;z-index:1}
.ladder .lv.on b{color:var(--oxido)}.ladder .lv.on span{color:var(--osso)}
.ladder .lv.goal{border-left:3px solid var(--bronze2)}
.cta{border-top:1px solid rgba(168,134,85,.5);padding:20px 0 0;margin:28px 0 8px}
.cta h2{margin-top:4px}
.cta p{font-size:14.5px;color:var(--mut);margin-bottom:6px}
.cta a{color:var(--bronze2);font-weight:600;font-size:14.5px;text-decoration:none;border-bottom:1px solid var(--bronze2);padding-bottom:1px}
.steps{list-style:none;margin:14px 0 18px;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 40px;font-size:14.5px;color:var(--txt)}
.steps li:before{content:counter(s);position:absolute;left:0;top:4px;width:28px;height:28px;border:1px solid var(--bronze2);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;color:var(--bronze2)}
.acts{display:grid;gap:10px;margin-top:10px}
#ov{position:fixed;inset:0;background:rgba(23,20,15,.94);z-index:9;overflow:auto;padding:18px}
#ov .c{max-width:580px;margin:0 auto;background:var(--osso);padding:18px}
#ov img{width:100%;display:block;margin:10px 0;border:1px solid var(--bronze)}
#ov textarea{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid var(--bronze);background:var(--osso2);margin:10px 0}
.foot{margin-top:28px;font-size:12px;color:var(--mut)}
@media(max-width:360px){h1{font-size:34px}.hero h1{font-size:27px}.lk button{min-height:48px;font-size:16px}}
@media print{.nav,#ov,.acts,.prog,.care .btn{display:none!important}body{background:#fff}.w{padding:0}.hero,.bar,.bar i,.lvl span.on,.or,.care,.ladder .lv.on,.rules .ic,.chip,.dc{-webkit-print-color-adjust:exact;print-color-adjust:exact}.blk,.dc{break-inside:avoid}}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.tile{border:1px solid rgba(168,134,85,.55);background:var(--osso2);padding:11px 10px;font-size:13px;line-height:1.35;color:var(--mut);min-height:74px}
.tile b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:3px;font-weight:600}
.tile.on{background:var(--ink);border-color:var(--ink);color:#D9D0C1}.tile.on b{color:var(--osso)}
.tile.half{border-left:4px solid var(--bronze)}
.tile .st{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-top:6px;color:var(--bronze2)}
.tile.on .st{color:#E0A58F}
.bal{position:relative;height:14px;background:linear-gradient(90deg,var(--osso3),var(--osso3));margin:26px 0 8px;border:1px solid rgba(168,134,85,.5)}
.bal .mid{position:absolute;left:35%;width:30%;top:0;bottom:0;background:rgba(168,134,85,.28)}
.bal .pin{position:absolute;top:-9px;width:4px;height:30px;background:var(--oxido);margin-left:-2px}
.bal .pin:after{content:"VOCÊ";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--oxido)}
.balL{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.abc{list-style:none;margin:10px 0}
.abc li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(168,134,85,.4);font-size:14.5px;color:var(--txt)}
.abc li b.k{font-family:Fraunces,serif;font-weight:400;font-size:20px;color:var(--oxido);line-height:1.1}
.abc li span b{color:var(--ink);font-weight:600}
</style></head><body>

const val=id=>S.a[id]===undefined?0:S.a[id];

function compute(){const r={a:{},p:{}};

 r.pMean=Math.round(PK.reduce((s,k)=>s+r.p[k],0)/PK.length);
 r.pra=Math.round((r.aMean+r.pMean)/2);r.lv=lvOf(r.pra);
 r.qd=r.per>=50?(r.pra>=50?"fir":"ima"):(r.pra>=50?"mai":"gua");

 r.aRank=AK.map((k,ix)=>({k,v:r.a[k],ix})).sort((x,y)=>x.v-y.v||x.ix-y.ix);
 r.pRank=PK.map((k,ix)=>({k,v:r.p[k],ix})).sort((x,y)=>x.v-y.v||x.ix-y.ix);
 r.dur=raw("dur");r.bra=raw("bra");
 r.bal=Math.max(3,Math.min(97,Math.round(50+(r.dur-r.bra)/2)));
 r.tom=Math.max(r.dur,r.bra)<50?"cal":(r.dur>=50&&r.bra>=50?"osc":(r.dur>r.bra?"dur":"bra"));
 r.eng=Object.keys(ENG).map((id,ix)=>({id,v:val(id),ix})).sort((x,y)=>y.v-x.v||x.ix-y.ix);
 r.engOn=r.eng.filter(x=>x.v>=3);r.engHalf=r.eng.filter(x=>x.v==2);

 return r}

 const cx=X(r.per),cy=Y(r.pra);

 const tx=cx>L+W-60?cx-12:cx+12,an=cx>L+W-60?"end":"start";

 s+=`<polygon points="${P.map(p=>p.map(x=>x.toFixed(1)).join(",")).join(" ")}" fill="rgba(158,59,36,.2)" stroke="#9E3B24" stroke-width="2.5" stroke-linejoin="round"/>`;
 const low=r.pRank[0].k;

 const LB={cla:["CLAREZA"],ton:["TOM E","CONCISÃO"],lib:["LIBERDADE E","CONSEQUÊNCIA"],pal:["PALAVRA"],cri:["CRITÉRIO"]};
 PK.forEach((k,i)=>{const a=ang(i),x=C+Math.cos(a)*(R+18),y=C+Math.sin(a)*(R+18);const an=Math.abs(Math.cos(a))<.3?"middle":Math.cos(a)>0?"start":"end";

 ${r.engOn.length?r.engOn.slice(0,3).map(x=>`<div class="or"><span class="lab">${ENG[x.id].n}</span><p>${ENG[x.id].c}</p><p style="font-size:13.5px;color:var(--mut)">Você marcou: “${QT[x.id][2].replace(/\.$/,"")}”.</p></div>`).join(""):r.engHalf.length?`<div class="or"><span class="lab">${ENG[r.engHalf[0].id].n}</span><p>${ENG[r.engHalf[0].id].c}</p></div>`:`<p>Isso costuma indicar que, quando você diz que se posicionou, de fato houve um comunicado. Continue checando a cada conversa importante, porque autoengano é justamente o que a gente não vê.</p>`}</div>`;

function wrap(x,text,X,y,w,lh){const words=plain(text).split(" ");let line="";for(const wd of words){const t=line?line+" "+wd:wd;if(x.measureText(t).width>w&&line){x.fillText(line,X,y);y+=lh;line=wd}else line=t}if(line){x.fillText(line,X,y);y+=lh}return y}

 x.font="500 28px Manrope";x.fillStyle="#3D382F";y=wrap(x,"Como você se vê: "+r.per+" de 100. O que você faz: "+r.pra+" de 100 ("+r.lv.n.toLowerCase()+").",P,y+10,P2,40);

 x.font="500 20px Manrope";x.fillStyle="#6A6358";x.fillText("Brando demais",P,y+70);x.textAlign="center";x.fillText("Calibrado",W/2,y+70);x.textAlign="right";x.fillText("Duro demais",W-P,y+70);x.textAlign="left";y+=110;
