:root{--osso:#EEE7DB;--osso2:#F6F1E8;--osso3:#E5DCCC;--ink:#17140F;--txt:#3D382F;--mut:#6A6358;--bronze:#A88655;--bronze2:#7A5F38;--oxido:#9E3B24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--osso);color:var(--ink);font-family:Manrope,Arial,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden}
.w{max-width:580px;margin:0 auto;padding:22px 20px 120px}
.top{border-bottom:1px solid var(--bronze);padding:6px 0 16px;margin-bottom:26px}
.top img{width:190px;max-width:60%;display:block}
.lab{font-weight:700;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze2)}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:40px;line-height:1.06;margin:10px 0 18px;letter-spacing:-.01em}
h1 em,h2 em{font-style:normal;color:var(--oxido)}
h2{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:27px;line-height:1.15;margin:4px 0 0}
h3{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:21px;line-height:1.2;margin:0 0 10px}
p{color:var(--txt);margin-bottom:12px}
.lead{font-size:17px}
.small{font-size:14px;color:var(--mut)}
.opt{font-weight:400;color:var(--mut)}
.hint{font-size:13.5px;color:var(--mut);margin-top:8px}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 22px;padding:14px 0;border-top:1px solid rgba(168,134,85,.5);border-bottom:1px solid rgba(168,134,85,.5)}
.meta div{font-size:14px;color:var(--txt)}.meta b{display:block;font-family:Fraunces,serif;font-weight:400;font-size:24px;color:var(--ink)}
.fld{margin:8px 0 18px}.fld label,.fld .fl{display:block;font-weight:700;margin-bottom:8px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--osso2);border:1px solid rgba(168,134,85,.75);padding:13px 14px;border-radius:0;outline:none;-webkit-appearance:none}
.fld input:focus,.fld textarea:focus{border-color:var(--oxido)}
.sit{display:grid;gap:8px}
.sit button{font:inherit;font-size:15.5px;text-align:left;color:var(--ink);background:var(--osso2);border:1px solid rgba(168,134,85,.6);padding:14px 14px 14px 44px;position:relative;cursor:pointer;border-radius:0}
.sit button:before{content:"";position:absolute;left:15px;top:50%;width:16px;height:16px;margin-top:-8px;border:1px solid var(--bronze2);border-radius:50%}
.sit button.on{background:var(--ink);color:var(--osso);border-color:var(--ink)}
.sit button.on:before{background:var(--oxido);border-color:var(--osso);box-shadow:inset 0 0 0 3px var(--ink)}
.sit.miss button{border-color:var(--oxido)}
.err{color:var(--oxido);font-size:13.5px;min-height:18px;margin-top:6px;margin-bottom:0}
.note{border-left:2px solid var(--bronze);padding:4px 0 4px 14px;font-size:13.5px;line-height:1.5;color:var(--mut);margin:18px 0}
.tg{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;background:var(--osso2);border:1px solid rgba(168,134,85,.6);padding:14px;margin:0 0 18px;font-size:14.5px;color:var(--txt);cursor:pointer}
.tg input{width:20px;height:20px;accent-color:#9E3B24;margin-top:2px}.tg b{color:var(--ink);font-weight:700}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-family:Manrope,sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--osso);background:var(--ink);border:0;border-radius:0;padding:18px 14px;cursor:pointer}
.btn:active{background:var(--oxido)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.br{background:var(--bronze2)}
.btn:disabled{opacity:.6}
.prog{position:sticky;top:0;z-index:3;background:var(--osso);padding:12px 0 10px;margin:-6px 0 14px}
.prog .t{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:7px}
.prog .b{height:3px;background:var(--osso3)}.prog .b i{display:block;height:3px;background:var(--oxido);width:0;transition:width .3s}
.phd{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;margin:6px 0 12px}
.phd .mini svg{width:92px;height:auto;display:block;border:1px solid rgba(168,134,85,.45)}
.def{font-size:15px;background:var(--osso2);border-left:3px solid var(--bronze);padding:12px 14px}
.scl{font-size:13px;color:var(--mut);background:var(--osso2);border:1px solid rgba(168,134,85,.4);padding:10px 12px;margin:4px 0 8px}
.it{padding:22px 0;border-bottom:1px solid rgba(168,134,85,.35);scroll-margin-top:70px}
.qt{font-size:16.5px;color:var(--ink);font-weight:500;line-height:1.45;margin-bottom:14px}
.qn{font-size:12px;color:var(--bronze2);font-weight:700;margin-right:8px}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk button{font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--osso2);border:1px solid rgba(168,134,85,.6);border-radius:0;min-height:52px;cursor:pointer}
.lk button.on{background:var(--ink);border-color:var(--ink);color:var(--osso)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:7px}
.sel{font-size:13px;color:var(--oxido);min-height:18px;margin:4px 0 0;text-align:center}
.it.miss .lk button{border-color:var(--oxido)}
.mir{margin-top:12px;padding:12px;background:rgba(229,220,204,.55);border:1px dashed rgba(168,134,85,.6)}
.mir .mq{font-size:14.5px;color:var(--txt);margin-bottom:10px}.mir .mq .lab{display:block;font-size:10px;margin-bottom:4px}
.mir .lk button{min-height:44px;font-size:15px}
.fx{padding:22px 0}.fx button{display:grid;grid-template-columns:30px 1fr;gap:8px;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:var(--osso2);border:1px solid rgba(168,134,85,.6);padding:13px 14px;margin-bottom:8px;cursor:pointer;border-radius:0}
.fx button b{font-family:Fraunces,serif;font-weight:400;font-size:20px;color:var(--bronze2);line-height:1.1}
.fx button.on{background:var(--ink);color:var(--osso);border-color:var(--ink)}.fx button.on b{color:#C8A46A}
.fx.miss button{border-color:var(--oxido)}
.fx .fld{margin-top:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--osso);border-top:1px solid var(--bronze);padding:10px 20px calc(10px + env(safe-area-inset-bottom));z-index:4}
.nav .in{max-width:580px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.nav .btn{padding:16px 10px}
.hide{display:none!important}
.hero{background:var(--ink);color:var(--osso);padding:26px 22px;margin:6px 0 22px}
.hero .lab{color:var(--bronze)}
.hero h1{color:var(--osso);font-size:33px;margin:10px 0 14px}
.hero h1 .sub{display:block;font-size:20px;color:#C8A46A;margin-top:6px}
.hero p{color:#D9D0C1;margin:0}
.lvl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:20px 0 0}
.lvl span{font-size:10.5px;text-align:center;padding:8px 3px;border:1px solid rgba(168,134,85,.6);color:#B9AE9C;line-height:1.25;display:flex;align-items:center;justify-content:center}
.lvl span.on{background:var(--oxido);border-color:var(--oxido);color:var(--osso);font-weight:700}
.blk{padding:24px 0;border-top:1px solid rgba(168,134,85,.5)}
.bars .r{margin:12px 0}
.bars .r .h{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.bars .r .h b{font-weight:700}.bars .r .h span{font-size:13px;white-space:nowrap}
.bar{height:8px;background:var(--osso3);margin-top:6px;position:relative}.bar i{display:block;height:8px;background:var(--bronze)}
.bar.tk2:before,.bar.tk2:after{content:"";position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--mut)}
.bar.tk2:before{left:35%}.bar.tk2:after{left:60%}
.bar.b2{height:5px;margin-top:3px}.bar.b2 i{height:5px;background:var(--ink);opacity:.55}
.svgw{background:var(--osso2);border:1px solid rgba(168,134,85,.45);padding:8px;margin:12px 0}
.svgw svg{display:block;width:100%;height:auto}
.svgw.sq{max-width:420px;margin-left:auto;margin-right:auto}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:16px;height:10px;vertical-align:middle;margin-right:6px}
.leg i.hz{background:repeating-linear-gradient(45deg,#A88655 0 3px,#E9DCC6 3px 6px)}
.dc{border:1px solid rgba(168,134,85,.55);background:var(--osso2);padding:18px;margin:14px 0}
.dc.st-no{border-left:4px solid var(--oxido);background:#fff}
.dc.st-fr{border-left:4px solid var(--bronze)}
.dc.st-na{opacity:.85}
.dc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dc .hd h3{margin-top:4px}
.dc .sc{font-family:Fraunces,serif;font-size:38px;line-height:1;color:var(--ink);text-align:right;white-space:nowrap}
.dc .sc small{font-family:Manrope,sans-serif;font-size:11px;color:var(--mut);display:block;margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.dc.st-no .sc small{color:var(--oxido)}.dc.st-fr .sc small{color:var(--bronze2)}
.dc .bar{margin:10px 0 14px}
.dtype+.small,.dots+.small{margin-top:8px}
.lab.sp{margin:14px 0 6px;font-size:10.5px}
.dots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dots span{font-size:12.5px;text-align:center;padding:10px 4px;border:1px solid rgba(168,134,85,.5);color:var(--mut);line-height:1.25}
.dots span i{display:block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bronze);margin:0 auto 6px}
.dots span.on{background:var(--ink);color:var(--osso);border-color:var(--ink)}.dots span.on i{background:#C8A46A;border-color:#C8A46A}
.dots.lock span i{border-radius:2px}
.dots.lock span.off{border-color:var(--oxido);color:var(--oxido);background:#fff}.dots.lock span.off i{border-color:var(--oxido);background:repeating-linear-gradient(45deg,#9E3B24 0 2px,#fff 2px 4px)}
.dtype{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dtype span{font-size:12.5px;text-align:center;padding:9px 4px;border:1px solid rgba(168,134,85,.5);color:var(--mut);line-height:1.25}
.dtype span.on{background:var(--ink);color:var(--osso);border-color:var(--ink);font-weight:700}
.dtype.col{grid-template-columns:1fr}.dtype.col span{text-align:left;padding:9px 12px}.dtype.col b{font-family:Fraunces,serif;font-weight:400;margin-right:6px}
.quote{list-style:none;margin:6px 0 4px}.quote li{position:relative;padding:8px 0 8px 18px;color:var(--txt);font-size:14.5px;border-bottom:1px dashed rgba(168,134,85,.35)}
.quote li:before{content:"";position:absolute;left:0;top:17px;width:7px;height:7px;background:var(--bronze)}
.quote.lo li:before{background:var(--oxido)}
.mirror{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(168,134,85,.5)}
.or{background:var(--osso2);border-left:3px solid var(--oxido);padding:16px 18px;margin:12px 0}
.or p:last-child{margin-bottom:0}
.or .lab{margin-bottom:6px;display:block}
.care{background:#F7E6E0;border:2px solid var(--oxido);padding:18px;margin:0 0 22px}
.care h3{color:var(--oxido)}.care p{color:#3a1d14}.care .btn{margin-top:6px}
.steps{list-style:none;margin:10px 0 0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 40px;font-size:14.5px;color:var(--txt)}
.steps li:before{content:counter(s);position:absolute;left:0;top:4px;width:28px;height:28px;border:1px solid var(--bronze2);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;color:var(--bronze2)}
.acts{display:grid;gap:10px;margin-top:10px}
.cta{border-top:1px solid rgba(168,134,85,.5);padding:20px 0 0;margin:28px 0 8px}
.cta p{font-size:14.5px;color:var(--mut);margin-bottom:6px}
.cta a{color:var(--bronze2);font-weight:700;font-size:14.5px;text-decoration:none;border-bottom:1px solid var(--bronze2);padding-bottom:1px}
#ov{position:fixed;inset:0;background:rgba(23,20,15,.94);z-index:9;overflow:auto;padding:18px}
#ov .c{max-width:580px;margin:0 auto;background:var(--osso);padding:18px}
#ov img{width:100%;display:block;margin:10px 0;border:1px solid var(--bronze)}
#ov textarea{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid var(--bronze);background:var(--osso2);margin:10px 0}
.foot{margin-top:28px;font-size:12px;color:var(--mut)}
@media(max-width:360px){h1{font-size:34px}.hero h1{font-size:28px}.lk button{min-height:48px;font-size:16px}.phd{grid-template-columns:72px 1fr}.phd .mini svg{width:72px}.dots span,.dtype span{font-size:11.5px}}
@media print{.nav,#ov,.acts,.prog,.care .btn{display:none!important}body{background:#fff}.w{padding:0}.hero,.bar,.bar i,.lvl span.on,.or,.care,.dc,.dots span,.dtype span,.svgw{-webkit-print-color-adjust:exact;print-color-adjust:exact}.blk,.dc,.svgw{break-inside:avoid}}

  if(p.id==="lib"&&S.libSkip){r.el.lib={t:null,st:"sk",pct:null};return}
  const t=sum(p.id,side);r.el[p.id]={t:t,st:band(t),pct:Math.round(t/20*100),base:band(t)}});
 /* Admiração: conte as fontes (itens 1, 2 e 3 com nota 3 ou 4) */
 const fontes=[0,1,2].map(i=>it("adm",i,side)>=3);r.fontes=fontes;const nf=fontes.filter(Boolean).length;r.nf=nf;
 r.el.adm.st=nf===0?"no":nf===1?"fr":"ok";r.el.adm.forca=["faltando","frágil","moderada","forte"][nf];

 if(fis||emo||intl)r.el.seg.st="no";
 r.fisica=fis;
 /* Desejo: tipo */

  r.dtipo=s>=8?"todo":(g>=2&&s<=5?"prazer":"misto");
  if(r.dtipo==="prazer"&&r.el.des.st==="ok")r.el.des.st="fr"}

 if(side==="a"){if(S.fx==="B"&&r.el.fut.st==="ok")r.el.fut.st="fr";if(S.fx==="C")r.el.fut.st="no";r.cond=S.fx==="B"}

 r.missCon=["gra","fut"].filter(F);r.missBase=cols.filter(F).concat(F("con")?["con"]:[]);

 const up=["adm","res","seg","des"].filter(id=>r.el[id].st!=="no"&&r.el[id].st!=="na");
 r.combo=COMBO[up.join("+")]||(up.length===0?"Nenhuma coluna está de pé: ainda não há alicerce sobre o qual o amor possa ser criado.":up.length===1?"Só uma coluna está de pé: o alicerce está muito incompleto.":null);

 r.worst=scored.slice().sort((a,b)=>r.el[a].t-r.el[b].t)[0];
